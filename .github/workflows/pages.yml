name: Pages

# Publishes the in-browser demo (site/ + decloak.wasm) to GitHub Pages.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "cmd/decloak-wasm/**"
      - "internal/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          mkdir -p _site
          cp site/* _site/
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" _site/
          GOOS=js GOARCH=wasm go build -trimpath -ldflags="-s -w" -o _site/decloak.wasm ./cmd/decloak-wasm
          ls -la _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
