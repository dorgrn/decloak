version: 2

project_name: decloak

before:
  hooks:
    - go mod tidy

builds:
  - id: decloak
    main: ./cmd/decloak
    binary: decloak
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/dorgrn/decloak/internal/version.Version={{.Version}}
      - -X github.com/dorgrn/decloak/internal/version.Commit={{.ShortCommit}}
      - -X github.com/dorgrn/decloak/internal/version.Date={{.Date}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
  - id: decloak-judge
    main: ./cmd/decloak-judge
    binary: decloak-judge
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/dorgrn/decloak/internal/version.Version={{.Version}}
      - -X github.com/dorgrn/decloak/internal/version.Commit={{.ShortCommit}}
      - -X github.com/dorgrn/decloak/internal/version.Date={{.Date}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - builds: [decloak, decloak-judge]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - NOTICE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
